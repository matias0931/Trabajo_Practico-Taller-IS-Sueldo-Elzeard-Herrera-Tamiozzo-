[project]
name = "taller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guadalupe", email = "paulaguadalupe1944@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "google-genai>=3.6.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
